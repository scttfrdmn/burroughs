name: ci

# Two architectures on purpose (contract §9, G-1): GitHub's ubuntu-24.04 runner
# is x86-64 (TSO) and ubuntu-24.04-arm is AArch64 (weakly ordered). The dev box
# is arm64 — the weak side, which is the side that caught D20. The §4 litmus
# battery is a v1 acceptance artifact, but the runners it needs exist from the
# first push (decision: Scott, session 0002/0003).
#
# Every quality tool is pinned in tools/go.mod via `tool` directives, never in
# this file: the linter version is repo state, so a green board on a laptop and
# a green board here mean the same thing. They run as
# `go tool -modfile=tools/go.mod <name>`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Skip-forbidden mode, workflow-wide (grave #29, Scott's directive on #30).
#
# A skip is not a verdict: it reports that the question could not be asked, and
# every board control in internal/spec declines that way when testdata/spec is
# absent. CI ran the project's entire history without the oracle in the room, green
# every time, because a job that asks nothing passes.
#
# Set here rather than per-job on purpose. Per-job is the instance fix; the class is
# "a CI job that runs tests without the corpus it judges against," and a job added
# next month would need someone to remember. Inheritance means the default is
# strict and an exemption has to be written down. Jobs that run no tests (lint,
# vuln) simply never read it.
#
# The consequence is deliberate: any job running `go test` must now vendor the
# suite. That is the point — it is what makes the numbers in the log mean something.
env:
  BURROUGHS_NO_SKIP: '1'

# `pipefail`, workflow-wide — because without it a pipe discards the exit code of
# everything but its last stage, and this file counts things through pipes.
#
# **GitHub's default `run:` shell is `bash -e {0}`, which has `-e` and *not*
# `pipefail`.** Naming `bash` explicitly is what changes it: the documented
# invocation for `shell: bash` is `bash --noprofile --norc -eo pipefail {0}`. So this
# block adds exactly one thing — pipe-head failures now count — and leaves `-e`
# where it already was.
#
# The class it closes: `ls testdata/spec/*.wast | wc -l` reports `0` when `ls` fails,
# because `wc` succeeded, so a broken fetch produced a *number* instead of an error
# and only a downstream floor turned it red. That is a verdict travelling on the
# wrong channel — the count answered a question about the corpus's size using an
# input that was really an enumeration failure. `make bench` had the same defect with
# no floor behind it and it was silently green for the whole project's history
# (grave #289).
#
# Set here for the reason `env:` above is set here, and the argument transfers
# unchanged: per-job is the instance fix, the class is "a pipe added next month by
# someone who did not read this file," and inheritance makes the safe thing the
# default so an exemption has to be written down. A step that genuinely wants a
# failing head ignored says so at the step with `|| true`, which is then visible.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum

      - name: pipefail is in effect, here and in the Makefile
        # Two claims, two shells, because they are configured in two places and can
        # regress independently: `defaults.run.shell: bash` above governs `run:` blocks,
        # `SHELL` in the Makefile governs recipes. Asserted rather than assumed — a
        # settings line nobody checks is an intention, and this one has already been
        # silently false once.
        #
        # **The Makefile half is checked here specifically because this runner's `make` is a
        # different version from the dev box's.** The flag lives in `SHELL` rather than
        # `.SHELLFLAGS` precisely because macOS ships GNU Make 3.81, which ignores the latter
        # without complaint; a fix validated on only one of the two makes is how that defect
        # survived in the first place. `make pipefail-check` asks make 4.x the same question
        # `make check` asks 3.81 locally.
        #
        # Under `pipefail` a pipeline whose head fails is non-zero, so `false | true` is
        # non-zero and the `if` does not fire. Without it the pipeline reports success.
        run: |
          if false | true; then
            echo "::error::this run-block has no pipefail — defaults.run.shell was changed or removed"
            exit 1
          fi
          make pipefail-check

      - name: gofumpt
        # A diff check, not a suggestion. Formatting is never a review topic.
        # --diff reports without rewriting and exits non-zero when it would
        # change something, so the exit code is the verdict — capturing output
        # and testing for non-empty would also catch `go: downloading ...`
        # progress lines on a cold module cache, which is how the first version
        # of this step failed on both arches while lint passed.
        #
        # The probe is #322 and mirrors `make fmt-check`: exit 0 from --diff means
        # "no disagreement" and never "I looked", so this step first asks the
        # formatter a question whose answer is known. The probe source carries a
        # gofumpt-*only* violation (a blank line at the top of a block, which plain
        # gofmt leaves alone), so an unchanged or empty reply means the tool did not
        # run or is not gofumpt — and the tree check would then have passed
        # vacuously. See the Makefile target for the full reasoning; the two must
        # stay mirrors, a surprise in CI being a bug in the Makefile.
        run: |
          probe="$(printf 'package p\n\nfunc F() {\n\n\tx := 0\n\t_ = x\n}\n')"
          got="$(printf '%s\n' "$probe" | go tool -modfile=tools/go.mod golangci-lint fmt --diff --stdin 2>/dev/null)"
          if [ -z "$got" ] || [ "$got" = "$probe" ]; then
            echo "::error::gofumpt liveness probe failed: a deliberately misformatted probe came back unchanged, so this step cannot distinguish a formatted tree from a formatter that never ran (#322)"
            exit 1
          fi
          if ! go tool -modfile=tools/go.mod golangci-lint fmt --diff ./...; then
            echo "::error::gofumpt would reformat the tree; run: make fmt"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      - name: vendor the spec suite
        # Required, not optional: BURROUGHS_NO_SKIP=1 is set workflow-wide, so the
        # board controls below now *fail* on an unvendored corpus instead of
        # skipping. This step is the grave's actual fix — the one line whose absence
        # made every green in this job's history vacuous.
        run: make spec-tests

      - name: vendor the reference interpreter
        # A second corpus with a second fetch (decision 0007), needed here for a
        # reason worth stating: this job runs `go test ./...`, which includes the
        # extractor's tests, and those call testenv.RequireSpecRef. Under
        # BURROUGHS_NO_SKIP=1 that is a *fail*, not a skip — which is the policy
        # working, and it caught this omission on the first CI run of PR #43. The
        # drift check proper lives in the conformance job; what this job needs is
        # merely the corpus its whole-tree test run reaches.
        #
        # The general shape: `go test ./...` inherits every corpus requirement in
        # the tree, so a job running it must vendor everything, not only the corpus
        # the job was thinking about.
        run: make spec-ref

      - name: both corpora are vendored
        # Guard the guard, for both. A skip is impossible under NO_SKIP, but a
        # *truncated* fetch is a different failure: it satisfies os.Stat, passes the
        # Go-level door, and then yields a board or an extraction computed over
        # whatever happened to arrive. Assert the inputs before trusting anything
        # computed from them.
        #
        # **The counter below is a loop and not `ls | wc -l`, and the reason is `pipefail`.**
        # It used to be a pipe, and the pipe swallowed `ls`'s exit code: a missing corpus
        # yielded `n=0` instead of an error, so this floor was the *only* thing that turned a
        # broken fetch red — a backstop nobody could see from here. `pipefail` is now set
        # workflow-wide, which fixes the swallowing and creates a second problem at exactly
        # this site: with `-e` also in force, `n="$(ls … | wc -l)"` would now abort the step
        # **silently**, before the `::error::` line below could say what was wrong. Louder,
        # but mute. So the count is taken a way that has no failure to propagate — an
        # unmatched glob is zero files, which is a legitimate state and is reported *by the
        # floor*, with its diagnostic. `if` keeps the test out of `-e`'s reach.
        #
        # The floor therefore still carries the truncation check it advertises, and no longer
        # doubles as a swallowed-exit-code backstop; that job moved to `defaults.run.shell`.
        # The `wc -c` below keeps its pipe, being already safe: `|| echo 0` makes the
        # substitution succeed either way, so `pipefail` changes nothing there.
        #
        # **That loop now lives in `scripts/suite-count.sh` (#340), which keeps both properties
        # above and adds the one they were missing:** the glob it replaced was dot-blind, so a
        # tree holding 257 vectors and 257 AppleDouble sidecars counted 257 here and 514 in Go.
        # One definition per side, with a control between them — the count this floor is applied
        # to is now the same *set* `testenv.SuitePaths` measures, not merely the same number.
        run: |
          n="$(scripts/suite-count.sh testdata/spec)"
          d=third_party/spec/interpreter/binary/decode.ml
          b="$(wc -c <"$d" 2>/dev/null | tr -d ' ' || echo 0)"
          echo "vendored $n .wast files; reference decode.ml $b bytes"
          if [ "$n" -lt 250 ]; then
            echo "::error::expected ≥250 .wast files, found $n — the suite fetch is broken"
            exit 1
          fi
          if [ "${b:-0}" -lt 20000 ]; then
            echo "::error::decode.ml is $b bytes (want ≥20000) — the reference fetch is broken"
            exit 1
          fi

      - name: test
        # -shuffle=on so test order is never load-bearing.
        run: go test -shuffle=on ./...

      - name: race
        run: go test -race -shuffle=on ./...

      - name: no test declined to answer
        # Suspenders to the harness's belt. The flag makes a skip impossible from
        # inside; this makes it visible from outside, so the two would have to fail
        # together for a skip to pass unnoticed. Reads the *output* channel, not the
        # exit code — a skip does not fail a test run, which is the entire problem.
        run: |
          out="$(go test -v -shuffle=on ./... 2>&1)"
          if printf '%s\n' "$out" | grep -E '^\s*(---\s*)?SKIP' ; then
            echo "::error::a test skipped under BURROUGHS_NO_SKIP=1 — every skip must route through internal/testenv, where the flag revokes it"
            exit 1
          fi
          echo "no SKIP lines"

      - name: go mod tidy is clean
        # The engine module only. `tidy` is NOT run on tools/go.mod: a tool
        # modfile has no packages of its own, so tidy resolves the tools'
        # transitive test dependencies *and* discovers this repo through the
        # module proxy, adding `require github.com/scttfrdmn/burroughs v0.0.1`
        # — the project depending on a published copy of itself. `go get -tool`
        # maintains that file; tidy actively damages it.
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod; then
            echo "::error::go mod tidy changed go.mod; commit the result"
            exit 1
          fi

  lint:
    # One arch is enough: these linters are not architecture-sensitive, and the
    # matrix above is about memory ordering, not vet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum

      - name: golangci-lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

      - name: deadcode
        # The unreachable-error grave promoted to a tool (grave #3). A finding
        # here is a classification question, not automatically a bug: declared
        # and tracked is a TODO with an audit trail, silent is a grave. Anything
        # not in the allowlist below has failed to answer that question.
        run: |
          # 2>/dev/null deliberately: deadcode reports findings on stdout and
          # exits 0, so the output *is* the verdict here — but stderr carries
          # `go: downloading ...` on a cold cache, which would read as a finding.
          out="$(go tool -modfile=tools/go.mod deadcode -test ./... 2>/dev/null || true)"
          printf 'deadcode says:\n%s\n' "$out"
          # The allowlist is empty. It held exactly one entry — reader.u64, tracked
          # in #19 — until #36 gave limits min/max their true 64-bit width and made
          # it reachable, which is the placeholder discipline's intended ending: a
          # deferral retired by a production caller, not by a suppression outliving
          # its reason. An entry left here after its subject became reachable would
          # license the next regression silently. Mirrors the Makefile's deadcode
          # target, which is the point of both existing.
          filtered="$(printf '%s\n' "$out" | grep -v '^$' || true)"
          if [ -n "$filtered" ]; then
            echo "::error::unreachable code with no tracking issue — name it at its definition site and file an issue, or delete it:"
            printf '%s\n' "$filtered"
            exit 1
          fi

  citations:
    # Every `#NNNN` a diff adds must resolve to a real issue or PR, every `decision NNNN` to a
    # file in docs/decisions/, and every `grave #N` to something actually labelled `type:grave`.
    #
    # **This job is where the check is binding, and that is a scoping ruling, not an accident**
    # (Scott, PR #285 relay). `make cite` exists so it is runnable locally, but the local run
    # cannot be the verdict: the issue half needs the network, so an offline run either fails for
    # a reason that is not a finding or — worse, if it were written to tolerate the absence —
    # passes by not asking. A pre-push hook has the same defect with a hidden switch:
    # `--no-verify` leaves no trace that it was skipped, and a skip is not a verdict. CI is where
    # the network exists and where the answer is recorded, so the offline case stops being a case
    # rather than being handled.
    #
    # `issues: read` explicitly, because the resolution is a real API call and a job whose
    # permissions are implied is a job that breaks when the repo's default changes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the range this checks is base..head and a shallow
          # checkout has no merge base to diff against. A truncated fetch here would make the
          # diff empty and the check would report a confident zero citations — which is the
          # exact defect the script's own domain line exists to make visible.
          fetch-depth: 0

      - name: citations resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # For a PR, the range is its merge base to its tip. For a push to main, it is the
          # merge that just landed. Both are set here rather than derived in the script: the
          # script takes a diff, and which diff is the workflow's question.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          # Check 4's subject, from the payload rather than derived. Its population is the body,
          # not the diff, so it is a *second invocation* — the same two-call shape closecheck uses
          # below, and for the same reason: two populations, two verdicts, neither hidden in the
          # other. A comment citing the PR it was written in is this repo's attribution
          # convention, which is why the diff call must not be given the number.
          SELF: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          git rev-parse --verify "$BASE" >/dev/null
          ./scripts/citecheck.sh "$BASE" "$HEAD"
          if [ -n "$SELF" ]; then
            ./scripts/citecheck.sh --pr "$SELF"
          else
            echo "citecheck: push event, no PR body to scan (the diff half above ran)."
          fi

      # No prose may close an issue as a side effect (grave #314). A step in *this* job rather
      # than a job of its own: it needs the same checkout, the same token, and the same two
      # permissions, and it asks the neighbouring question — that one checks whether the tracker
      # references a diff adds resolve, this checks whether they will silently act.
      #
      # **Both channels, because GitHub acts on both.** A keyword closes an issue from a commit
      # message reaching the default branch *or* from the PR body, and the specimen came in
      # through the body: a squash message is derived from the PR title and body by default, so
      # prose written for a human reader became an instruction stream. The commit half runs on
      # every event; the body half needs a PR number and is skipped on a push to main, where no
      # body exists — stated because *a skip is not a verdict*, and the thing being skipped here
      # is a question that has no subject rather than one going unasked.
      - name: no closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          ./scripts/closecheck.sh "$BASE" "$HEAD"
          if [ "${{ github.event_name }}" = pull_request ]; then
            ./scripts/closecheck.sh --pr "${{ github.event.pull_request.number }}"
          else
            echo "closecheck: push event, no PR body to scan (the commit half above ran)."
          fi

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck ./...

  conformance:
    # The suite is the oracle, so CI has to actually run it.
    #
    # The `build` job does not vendor the suite, which means every board control
    # skips there — requireSuite() calls t.Skip when testdata/spec is absent, so
    # the pass floor, the closed buckets, the fixture citations, and the gated
    # allowlist have all been passing by not running. A skip is not a verdict, and
    # a green board that never asked the question is the dishonest-board failure
    # wearing CI's clothes. This job is where the numbers get asserted.
    #
    # Two lanes, because they check different things and only one of them can:
    #
    #  * default features (every 3.0 gate off, v0's posture) — the board numbers,
    #    the regression floor, the closed buckets, and TestGatedVectors' per-vector
    #    allowlist.
    #  * all tracked gates on — TestAllGatesOnLeavesNothingGated, where the gated
    #    count MUST be zero. This is the structural control on the third verdict
    #    (Scott's condition on #27): the per-vector allowlist stops a vector from
    #    hiding *unnoticed*, and this stops it from hiding at all. Under full
    #    features every vector answers on the merits, so a vector parked in `gated`
    #    on the default board is simultaneously being honestly *failed* here, and
    #    stays failed until its feature actually works. `gated` becomes a deferral
    #    that cannot become a disappearance.
    #
    # Both lanes live in one job on purpose: they share the suite fetch, and a lane
    # that could be skipped independently of the other is a lane that will be.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum

      - name: vendor the spec suite
        run: make spec-tests

      - name: the suite is vendored
        # Guard the guard. Every board test calls requireSuite() and *skips* when
        # the suite is missing, so a broken fetch would turn this whole job green
        # by making it ask nothing — precisely the failure this job exists to end.
        # Assert the corpus is present before trusting any count that comes out of
        # it: a verdict without an identity check is hearsay.
        #
        # **The counter is `scripts/suite-count.sh` — see the `build` job's copy of this note for
        # the full reasoning.** It was a loop here for `pipefail`'s sake and the script keeps that
        # property (no pipe, unmatched glob honestly zero, the floor keeping its diagnostic); what
        # moving it out of the YAML adds is #340's fix, that the population counted here is the one
        # `testenv.SuitePaths` counts, sidecars and all, rather than a dot-blind twin of it.
        run: |
          n="$(scripts/suite-count.sh testdata/spec)"
          echo "vendored $n .wast files"
          if [ "$n" -lt 250 ]; then
            echo "::error::expected ≥250 .wast files, found $n — the suite fetch is broken and every board test would silently skip"
            exit 1
          fi

      - name: vendor the reference interpreter
        # The *authority*, as distinct from the suite that samples it (decision 0007).
        # A separate repo: WebAssembly/spec, pinned by SHA in the fetch script.
        #
        # Vendored *before* the board step, and the ordering is a finding rather than
        # tidiness. It sat after the board for one run, on the reasoning that only
        # `make opcode-drift` reads the reference — and then `internal/binary` grew
        # `TestImmBytesCitationsResolve`, which reads decode.ml too, so the board step
        # failed under NO_SKIP on a corpus that the very same job fetches nine lines
        # later. The corollary to *a job running `go test ./...` inherits every corpus
        # requirement in the tree*: a job's corpora are its **preconditions**, so they
        # are satisfied before the first step that runs tests, not next to the step
        # whose name mentions them. Which package needs which corpus is not a fact a
        # workflow file can track.
        run: make spec-ref

      - name: the reference is vendored
        # Guard the guard, same as the suite step above and for the same reason: the
        # drift check's Go-level door skips when the authority is absent, so a broken
        # fetch would make a later step pass by asking nothing. Assert the input
        # before trusting a verdict computed from it.
        #
        # Both files, because one fetch now feeds two grammars (decode.ml for the opcode
        # table, lexer.mll for the keyword table) and a guard naming only the first would
        # let a partial fetch through to the second — the derive-don't-enumerate law's
        # cheapest failure, an enumeration that stopped growing when the set did not. The
        # floors match internal/testenv's refFloors; they are a second site by necessity
        # (a workflow cannot read Go constants), which is why each one says which file it
        # describes rather than sharing a number.
        run: |
          fail=0
          for spec in \
            "third_party/spec/interpreter/binary/decode.ml:20000" \
            "third_party/spec/interpreter/text/lexer.mll:20000" \
          ; do
            d="${spec%:*}"; floor="${spec##*:}"
            n="$(wc -c <"$d" 2>/dev/null | tr -d ' ' || echo 0)"
            echo "reference ${d##*/}: ${n:-0} bytes (floor $floor)"
            if [ "${n:-0}" -lt "$floor" ]; then
              echo "::error::$d is ${n:-0} bytes (want ≥$floor) — the reference fetch is broken and the drift check would skip"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: conformance board (default features, all gates off)
        # -v so the boards land in the log: the bucket counts are the work plan, and
        # a PR reviewer should be able to read them without running anything.
        run: go test -v -shuffle=on ./internal/spec/ ./internal/binary/

      - name: no vector may hide in gated (all tracked gates on)
        # Named as its own step so the log says which control failed. The test
        # itself carries the argument; this is the CI face of it.
        run: go test -v -run TestAllGatesOnLeavesNothingGated ./internal/spec/

      - name: the opcode table still agrees with the reference (0007, condition 4)
        # Condition 4 of decision 0007. The committed table is machine-derived from
        # decode.ml; this re-runs the extraction and asserts equality, so reference
        # drift is a build failure rather than a diff nobody ordered. Cheap precisely
        # because mechanism B needs no OCaml toolchain.
        run: make opcode-drift

      - name: the keyword table still agrees with the reference (0009)
        # The same condition one grammar over: internal/text/keywords.go is machine-derived
        # from lexer.mll's keyword block, and this re-runs the extraction against the pinned
        # reference. Its own step rather than a line in the one above so the log names which
        # table drifted — two authorities, two verdicts.
        #
        # Note this step is why the reference *and* the suite are both vendored above:
        # keywordgen's citation check reads obsolete-keywords.wast to prove the eleven
        # mnemonics it omits are the eleven the suite asks about, and under
        # BURROUGHS_NO_SKIP=1 a missing vector is a failure, not a skip.
        run: make keyword-drift

  fuzz-smoke:
    # Short fuzz on every PR: enough to catch a target that stopped building or
    # a seed corpus that regressed, not enough to find deep bugs. The long runs
    # are scheduled — see nightly.yml.
    #
    # Budgets are in executions (-fuzztime Nx), not wall clock (#28). The purpose
    # above names *executions* — "did the target still build and still churn the
    # corpus" — and the budget must be in the quantity the purpose names, or the
    # job fails for reasons that are not findings. Wall clock was the wrong unit
    # twice: `context deadline exceeded` with no crasher on PR #27 and again on
    # PR #31, both after real progress (the second at ~70k execs/sec into a 20s
    # wall), against 130k–670k/sec locally — a ~7x spread that is a property of
    # shared runners, not of the code under test.
    #
    # Sizes are derived from the measured CI floor (~70k/sec, the rate on the run
    # that failed), not from converting the old seconds at a dev box's rate, and
    # they hold the old 2:1 ratio between targets.
    #
    # What the green runs under these budgets actually measure, because it is worse
    # than the sizing assumed and the number must not be inherited from the
    # estimate. Two independent runs, and the shape reproduces:
    #
    #   run       FuzzWastLexer 3M   step total   0/sec windows   peak burst
    #   160c8a4   178s               3m26s        47              605k/sec
    #   a4c0295   163s               3m08s        46              1.25M/sec
    #
    # So ~17-18k execs/sec effective, against ~70k assumed. Reported as a range and
    # from two runs on purpose: a single run cannot distinguish a property of the
    # environment from an accident of one scheduling, and the peak moving 605k ->
    # 1.25M is exactly the spread that makes any single figure a fiction. Two
    # witnesses agreeing on the *shape* (long stalls, faster-than-local bursts) is
    # the claim; neither number alone is.
    #
    # That cost is the honest price of the unit change and is accepted: a job that
    # takes three minutes and answers a fixed question beats one that takes one
    # minute and sometimes answers none.
    #
    # The stalls themselves get no issue, deliberately (ruling: Scott) — an issue no
    # work can close is a wish with a label, and GitHub's runners are not ours to
    # fix. This comment *is* where the finding lives, because this is the one place
    # it has consequences. If a stall ever breaks something actionable, that event
    # files its own issue with a reproducer attached. Note what the finding implies
    # if it worsens: a 4-worker runner pausing 18 consecutive seconds is contention
    # or GC, not throughput variance, so the budget is not what would need adjusting.
    #
    # timeout-minutes is a failsafe, not a budget. An executions budget has no
    # upper bound on duration, so a genuine hang would run until GitHub's default
    # 6h cap. 15 minutes is ~4x the measured 3m26s: loose enough that stall
    # variance cannot reach it, tight enough that a hang is caught. Naming it
    # separately keeps the two concerns distinct — the budget asks a fixed number
    # of questions, the timeout says something is structurally wrong.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum

      - name: vendor the spec suite
        # Corpora are seeded from the suite, so the fetch is what makes this
        # meaningful rather than boundary-seeds-only.
        run: make spec-tests

      - name: fuzz decoder
        run: |
          go test ./internal/binary/ -run XXX -fuzz FuzzDecodeModule -fuzztime 3000000x
          go test ./internal/binary/ -run XXX -fuzz FuzzULEB -fuzztime 1500000x
          # The instruction grammar's progress property (#43/#39). 1.5M, the same as
          # FuzzULEB: both are single-reader properties inside the module target's
          # surface, so the 2:1 ratio to FuzzDecodeModule is the reason, not the count.
          # It shipped ungated and is now held by TestEveryFuzzTargetIsGated.
          go test ./internal/binary/ -run XXX -fuzz FuzzConstExprProgress -fuzztime 1500000x

      - name: fuzz wast lexer
        run: |
          go test ./internal/spec/ -run XXX -fuzz FuzzWastLexer -fuzztime 3000000x
          go test ./internal/spec/ -run XXX -fuzz FuzzParseNodeProgress -fuzztime 1500000x

      - name: fuzz wat lexer
        # 350k, and deliberately not the 2:1-to-3M ratio the targets above use: that
        # convention assumes comparable per-execution cost, and this target's is ~9x
        # higher. Measured on one dev box, same command, corpus cleared between runs —
        # FuzzWastLexer 300k in 6.8s (~44k/sec), FuzzLexerProgress 300k in 60s (~5k/sec).
        # Two causes, both structural: the seeds are large (names.wast 56KB,
        # utf8-custom-section-id.wast 46KB) and Next sweeps every arm at every position.
        #
        # So 3M here would be ~9x the wall clock of the 3M above, which measured 178s in
        # CI — roughly 27 minutes, past this job's 15-minute failsafe. Budgeting by
        # executions is still right (the purpose is "did the target still churn the
        # corpus"), but the *size* has to come from this target's own throughput rather
        # than from a sibling's number. 350k is ~3M scaled by the measured ratio.
        #
        # The rate is a dev-box figure and the runner is bimodal (see above), so treat it
        # as an order of magnitude, not a constant. If this step's duration approaches the
        # failsafe, the ratio is what to re-measure.
        run: go test ./internal/text/ -run XXX -fuzz FuzzLexerProgress -fuzztime 350000x

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/**
          if-no-files-found: ignore
